<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Crypto Live Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #0b1120;
      color: #e5e7eb;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }
    .timestamp {
      font-size: 0.9rem;
      opacity: 0.7;
      margin-bottom: 12px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 1200px;
      background: #020617;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #1f2937;
      text-align: left;
      font-size: 0.9rem;
    }
    th {
      background: #111827;
      font-weight: 600;
    }
    tr:nth-child(even) td {
      background: #020617;
    }
    tr:nth-child(odd) td {
      background: #020617;
    }
  </style>
</head>
<body>
  <h1>Crypto Live Dashboard</h1>
  <div class="timestamp">
    This is a test shell. Replace this content with your generated table later.
  </div>

  <table>
    <thead>
      <tr>
        <th>Symbol</th>
        <th>Price</th>
        <th>24h Change</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>BTCUSDT</td>
        <td>12345.67</td>
        <td>+1.23%</td>
      </tr>
      <tr>
        <td>ETHUSDT</td>
        <td>2345.67</td>
        <td>-0.45%</td>
      </tr>
    </tbody>
  </table>

  <script>
    function reloadDashboard() {
      const url = new URL(window.location.href);
      // cache-buster so the browser always fetches the newest version
      url.searchParams.set('t', Date.now());
      window.location.href = url.toString();
    }

    // Reload every 15 seconds (15000 ms). Adjust if you want slower/faster.
    setInterval(reloadDashboard, 15000);
  </script>
</body>
</html>
