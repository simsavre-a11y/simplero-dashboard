<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crypto dashboard</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #0b1120;
      color: #e5e7eb;
    }
    h1 {
      margin: 0 0 4px 0;
      font-size: 18px;
    }
    .timestamp {
      margin: 0 0 12px 0;
      font-size: 11px;
      color: #9ca3af;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      background: #020617;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 6px 10px;
      border-bottom: 1px solid #111827;
      text-align: right;
      font-size: 13px;
    }
    th:first-child, td:first-child {
      text-align: left;
    }
    th {
      background: #111827;
      color: #f9fafb;
      position: sticky;
      top: 0;
    }
    tr:nth-child(even) td {
      background: #020617;
    }
    tr:nth-child(odd) td {
      background: #020617;
    }
  </style>
</head>
<body>
  <h1>Live crypto data</h1>
  <p class="timestamp">Generated at 2025-11-19 21:17:06</p>
  <table>
    <tr>
      <th>Symbol</th>
      <th>Price</th>
      <th>Volume Today</th>
      <th>Volume 24h</th>
    </tr>
    <tr>
      <td>2886.42</td>
      <td>88845.86</td>
      <td>26417.126900000007</td>
      <td>2395526978.7078676</td>
    </tr>
  </table>
</body>
</html>
